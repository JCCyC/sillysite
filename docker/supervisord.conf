[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
command=%(ENV_PG_BIN)s/postgres -D %(ENV_PGDATA)s
user=postgres
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=bash -c "until pg_isready -h 127.0.0.1 -q; do sleep 1; done; exec /app/.venv/bin/gunicorn main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 -w %(ENV_WEB_CONCURRENCY)s --access-logfile - --error-logfile -"
directory=/app
user=appuser
environment=HOME="/home/appuser"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:db-size-monitor]
command=/usr/local/bin/db-size-monitor.sh
user=postgres
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
