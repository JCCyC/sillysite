<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SillySite &mdash; Change Password</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    color-scheme: light dark;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f4f7;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    padding: 2.5rem;
    width: 100%;
    max-width: 360px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0 0 1.5rem;
    font-size: 1.4rem;
    text-align: center;
    color: #1a1a2e;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
    color: #333;
  }
  input {
    width: 100%;
    padding: 0.55rem 0.7rem;
    margin-bottom: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 0.6rem;
    border: none;
    border-radius: 6px;
    background: #e10600;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  button:hover:not(:disabled) {
    background: #c10500;
  }
  #message {
    margin-top: 1rem;
    font-size: 0.9rem;
    text-align: center;
  }
  #message.error {
    color: #c0392b;
  }
  #message.success {
    color: #2e7d32;
  }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Password change</h1>
    <form id="changepw-form">
      <label for="current-password">Current password</label>
      <input type="password" id="current-password" name="current-password" autocomplete="current-password" required>

      <label for="new-password">New password</label>
      <input type="password" id="new-password" name="new-password" autocomplete="new-password" required>

      <label for="confirm-password">Confirm new password</label>
      <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>

      <button type="submit" id="submit-button">Change password</button>
    </form>
    <div id="message"></div>
  </div>

<script src="/sillysite.js"></script>
<script>
const apikey = new URLSearchParams(window.location.search).get("apikey");
const form = document.getElementById("changepw-form");
const messageEl = document.getElementById("message");
const submitButton = document.getElementById("submit-button");

let username = null;

(async () => {
  try {
    const resp = await SillySite.get(window.location.origin, apikey, "/whoami");
    if (resp.status === 200) {
      username = JSON.parse(resp.body).username;
      document.getElementById("title").textContent = `Password change for ${username}`;
    }
  } catch (error) {
    // Leave the generic title in place if /whoami can't be reached.
  }
})();

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const currentPassword = document.getElementById("current-password").value;
  const newPassword = document.getElementById("new-password").value;
  const confirmPassword = document.getElementById("confirm-password").value;

  messageEl.textContent = "";
  messageEl.className = "";
  submitButton.disabled = true;

  try {
    if (!username) {
      throw new Error("Could not determine the current user");
    }

    if (newPassword !== confirmPassword) {
      throw new Error("New password and confirmation do not match");
    }

    await SillySite.changepw(window.location.origin, username, currentPassword, newPassword);

    messageEl.textContent = "Password changed successfully";
    messageEl.className = "success";
    form.reset();
  } catch (error) {
    messageEl.textContent = error.message;
    messageEl.className = "error";
  } finally {
    submitButton.disabled = false;
  }
});
</script>
</body>
</html>
